name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe dos módulos
        run: |
          for f in atlas@joaovitor12j.dev/*.js atlas@joaovitor12j.dev/app/*.js; do
            node --check --input-type=module < "$f" || { echo "erro de sintaxe em $f"; exit 1; }
          done
      - name: Schema do GSettings
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libglib2.0-bin
          glib-compile-schemas --strict --dry-run atlas@joaovitor12j.dev/schemas
      - name: Testes
        run: npm test
